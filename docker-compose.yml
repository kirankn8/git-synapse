name: git-synapse

x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-git_synapse}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-git_synapse}
  POSTGRES_DB: ${POSTGRES_DB:-git_synapse}
  # Accepts gh's GH_TOKEN too; the token file below takes precedence.
  GITHUB_TOKEN: ${GITHUB_TOKEN:-${GH_TOKEN:-}}
  GITHUB_TOKEN_FILE: /run/git-synapse/github-token
  GITLAB_TOKEN: ${GITLAB_TOKEN:-}
  BITBUCKET_USER: ${BITBUCKET_USER:-}
  BITBUCKET_TOKEN: ${BITBUCKET_TOKEN:-}
  GS_SECRET_KEY: ${GS_SECRET_KEY:-}
  INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-8}
  MAX_FILES_PER_COMMIT: ${MAX_FILES_PER_COMMIT:-60}
  MIN_PAIR_SUPPORT: ${MIN_PAIR_SUPPORT:-2}
  RENAME_SIMILARITY: ${RENAME_SIMILARITY:-50}
  BLOBLESS_THRESHOLD_KB: ${BLOBLESS_THRESHOLD_KB:-2097152}
  FORCE_BLOBLESS: ${FORCE_BLOBLESS:-false}
  RECENCY_HALF_LIFE_DAYS: ${RECENCY_HALF_LIFE_DAYS:-365}
  # Shared so the API reports the schedule the scheduler actually runs.
  REFRESH_CRON: ${REFRESH_CRON:-0 * * * *}
  DISCOVER_CRON: ${DISCOVER_CRON:-0 3 * * *}
  SCHEDULER_TZ: ${SCHEDULER_TZ:-UTC}
  MIRROR_ROOT: /data/mirrors
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-app-base: &app-base
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: git-synapse-app:latest
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - mirrors:/data/mirrors
    # Served from the host so UI edits need no image rebuild.
    - ./web:/app/web:ro
    # The directory, not the file: the token is replaced by atomic rename, which a file mount would miss.
    - ${GIT_SYNAPSE_TOKEN_DIR:-${HOME}/.git-synapse}:/run/git-synapse:ro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Docker's 64MB default is too small for parallel aggregation over the pair tables.
    shm_size: 1gb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-git_synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-git_synapse}
      POSTGRES_DB: ${POSTGRES_DB:-git_synapse}
      # Checksums catch silent corruption in the fact tables.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # Tuned for sort- and hash-heavy aggregation.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=128MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - effective_cache_size=3GB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - synchronous_commit=off
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-git_synapse} -d ${POSTGRES_DB:-git_synapse}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # REST API + the interactive web UI.
  api:
    <<: *app-base
    environment:
      <<: *app-env
    ports:
      - "${API_HTTP_PORT:-80}:8000"
      - "${API_PUBLISHED_PORT:-8080}:8000"
    command: >
      uvicorn git_synapse.api.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips=*

  # Daily refresh: fetch new commits, re-aggregate, re-score.
  scheduler:
    <<: *app-base
    environment:
      <<: *app-env
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      REFRESH_ON_START: ${REFRESH_ON_START:-false}
    command: python -m git_synapse.scheduler.main
    # No HTTP surface, so the image's default healthcheck does not apply.
    healthcheck:
      disable: true

  # MCP server over streamable HTTP, for coding agents.
  mcp:
    <<: *app-base
    environment:
      <<: *app-env
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8081
    ports:
      - "${MCP_PUBLISHED_PORT:-8081}:8081"
    command: python -m git_synapse.mcp.server --transport http --host 0.0.0.0 --port 8081
    # The MCP endpoint rejects plain GETs, so probe the socket rather than a route.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket,sys; s=socket.create_connection(('127.0.0.1',8081),3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # One-shot CLI. Not started by `up`; invoked with `docker compose run`.
  cli:
    <<: *app-base
    profiles: ["cli"]
    restart: "no"
    environment:
      <<: *app-env
    entrypoint: ["git-synapse"]
    command: ["--help"]

volumes:
  pgdata:
  # A named volume: a macOS bind mount slows ingest considerably.
  mirrors:
