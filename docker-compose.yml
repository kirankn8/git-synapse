# Git Synapse: change-coupling statistics over git history.
#
#   cp .env.example .env   # add your GITHUB_TOKEN
#   docker compose up -d
#   docker compose run --rm cli git-synapse ingest --all
#
# Portable to any machine with a container runtime: no host Python, no host git,
# no host Postgres. Only `.env` and the two volumes are machine-specific.

name: git-synapse

x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-git_synapse}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-git_synapse}
  POSTGRES_DB: ${POSTGRES_DB:-git_synapse}
  # gh exports GH_TOKEN on this machine, so accept either name and read the
  # live value rather than a copy that goes stale when gh reissues.
  # Fallback only. The authoritative source is the mounted token file below,
  # which the host keeps current and the code reads on every use.
  GITHUB_TOKEN: ${GITHUB_TOKEN:-${GH_TOKEN:-}}
  GITHUB_TOKEN_FILE: /run/git-synapse/github-token
  GITHUB_ORG: ${GITHUB_ORG:-}
  INCLUDE_PRIVATE: ${INCLUDE_PRIVATE:-true}
  INCLUDE_FORKS: ${INCLUDE_FORKS:-true}
  INCLUDE_ARCHIVED: ${INCLUDE_ARCHIVED:-true}
  ONLY_REPOS: ${ONLY_REPOS:-}
  SKIP_REPOS: ${SKIP_REPOS:-}
  INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-8}
  MAX_FILES_PER_COMMIT: ${MAX_FILES_PER_COMMIT:-60}
  INCLUDE_MERGES: ${INCLUDE_MERGES:-false}
  MIN_PAIR_SUPPORT: ${MIN_PAIR_SUPPORT:-2}
  RENAME_SIMILARITY: ${RENAME_SIMILARITY:-50}
  BLOBLESS_THRESHOLD_KB: ${BLOBLESS_THRESHOLD_KB:-2097152}
  FORCE_BLOBLESS: ${FORCE_BLOBLESS:-false}
  SCORE_BATCH_SIZE: ${SCORE_BATCH_SIZE:-200000}
  RECENCY_HALF_LIFE_DAYS: ${RECENCY_HALF_LIFE_DAYS:-365}
  DEFAULT_QUERY_LIMIT: ${DEFAULT_QUERY_LIMIT:-50}
  MAX_QUERY_LIMIT: ${MAX_QUERY_LIMIT:-1000}
  # Shared, not the scheduler's alone: /api/config reports the schedule and the
  # Jobs page displays it, so the API has to see the same value the scheduler
  # runs on. Declared only on the scheduler, the API fell back to the built-in
  # default and told the reader a cadence nothing was using.
  REFRESH_CRON: ${REFRESH_CRON:-0 * * * *}
  DISCOVER_CRON: ${DISCOVER_CRON:-0 3 * * *}
  SCHEDULER_TZ: ${SCHEDULER_TZ:-UTC}
  MIRROR_ROOT: /data/mirrors
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-app-base: &app-base
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: git-synapse-app:latest
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  volumes:
    - mirrors:/data/mirrors
    # Serve the hand-edited web UI from the host so edits take effect on refresh
    # (no image rebuild). The baked /app/web remains the fallback if unmounted.
    - ./web:/app/web:ro
    # The directory, not the file: the refresher replaces the token by atomic
    # rename, which swaps the inode, and a file bind-mount follows the old inode
    # and breaks. Read on every use, so a rotated credential takes effect with no
    # restart. Optional: absent, the code falls back to GITHUB_TOKEN.
    - ${GIT_SYNAPSE_TOKEN_DIR:-${HOME}/.git-synapse}:/run/git-synapse:ro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-git_synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-git_synapse}
      POSTGRES_DB: ${POSTGRES_DB:-git_synapse}
      # Checksums catch silent corruption in the fact tables.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # Tuned for an analytical workload: the pair-generation self-join and the
    # metric rebuild are both sort/hash heavy, and default Postgres settings
    # would spill them to disk.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=128MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - effective_cache_size=3GB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - synchronous_commit=off
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-git_synapse} -d ${POSTGRES_DB:-git_synapse}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # REST API + the interactive web UI.
  api:
    <<: *app-base
    environment:
      <<: *app-env
    ports:
      # Port 80 so the UI is reachable as a bare hostname (http://git-synapse) once
      # /etc/hosts maps it. Colima forwards privileged ports without needing
      # root on the host, unlike Docker Desktop's helper.
      - "${API_HTTP_PORT:-80}:8000"
      # Kept as a stable fallback: if something else grabs 80, or the hosts
      # entry is not installed, localhost:8080 still works.
      - "${API_PUBLISHED_PORT:-8080}:8000"
    command: >
      uvicorn git_synapse.api.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips=*

  # Daily refresh: fetch new commits, re-aggregate, re-score.
  scheduler:
    <<: *app-base
    environment:
      <<: *app-env
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      REFRESH_ON_START: ${REFRESH_ON_START:-false}
    command: python -m git_synapse.scheduler.main
    # No HTTP surface, so the image's default healthcheck does not apply.
    healthcheck:
      disable: true

  # MCP server over streamable HTTP, for coding agents.
  mcp:
    <<: *app-base
    environment:
      <<: *app-env
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8081
    ports:
      - "${MCP_PUBLISHED_PORT:-8081}:8081"
    command: python -m git_synapse.mcp.server --transport http --host 0.0.0.0 --port 8081
    # The MCP endpoint rejects plain GETs, so probe the socket rather than a route.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket,sys; s=socket.create_connection(('127.0.0.1',8081),3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # One-shot CLI. Not started by `up`; invoked with `docker compose run`.
  cli:
    <<: *app-base
    profiles: ["cli"]
    restart: "no"
    environment:
      <<: *app-env
    entrypoint: ["git-synapse"]
    command: ["--help"]

volumes:
  pgdata:
  # Bare git mirrors. Kept in a named volume so the ingest is not slowed by a
  # virtiofs/osxfs bind mount on macOS. Switch to a bind mount by replacing this
  # with `driver: local` + `device:` if you need the mirrors visible on the host.
  mirrors:
