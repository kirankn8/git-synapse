apiVersion: v1
kind: Service
metadata:
  name: {{ include "git-synapse.fullname" . }}
  labels:
    {{- include "git-synapse.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/component: api
    {{- include "git-synapse.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "git-synapse.fullname" . }}-api
  labels:
    {{- include "git-synapse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      {{- include "git-synapse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
        {{- include "git-synapse.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "git_synapse.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
          env:
            {{- include "git-synapse.env" . | nindent 12 }}
            - name: SCHEDULER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "git-synapse.fullname" . }}-config
                  key: SCHEDULER_ENABLED
            - name: REFRESH_ON_START
              valueFrom:
                configMapKeyRef:
                  name: {{ include "git-synapse.fullname" . }}-config
                  key: REFRESH_ON_START
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: mirrors
              mountPath: /data/mirrors
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: mirrors
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "git-synapse.fullname" . }}-mirrors
          {{- else }}
          emptyDir: {}
          {{- end }}
