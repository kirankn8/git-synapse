{{- if not .Values.secrets.existingSecret }}
{{- $current := lookup "v1" "Secret" .Release.Namespace (include "git-synapse.fullname" .) -}}
{{- $password := .Values.secrets.adminPassword -}}
{{- if and (not $password) $current }}{{- $password = (index $current.data "ADMIN_PASSWORD" | b64dec) -}}{{- end }}
{{- if not $password }}{{- $password = randAlphaNum 32 -}}{{- end }}
{{- $key := .Values.secrets.gsSecretKey -}}
{{- if and (not $key) $current }}{{- $key = (index $current.data "GS_SECRET_KEY" | b64dec) -}}{{- end }}
{{- if not $key }}{{- $key = randAlphaNum 64 -}}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "git-synapse.fullname" . }}
  labels:
    {{- include "git-synapse.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_EMAIL: {{ .Values.secrets.adminEmail | quote }}
  ADMIN_PASSWORD: {{ $password | quote }}
  GS_SECRET_KEY: {{ $key | quote }}
  {{- if .Values.secrets.githubToken }}
  GITHUB_TOKEN: {{ .Values.secrets.githubToken | quote }}
  {{- end }}
  {{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) }}
  POSTGRES_PASSWORD: {{ required "externalDatabase.password is required when postgresql.enabled=false and externalDatabase.existingSecret is empty" .Values.externalDatabase.password | quote }}
  {{- end }}
{{- end }}

{{- if .Values.postgresql.enabled }}
---
{{- $pg := lookup "v1" "Secret" .Release.Namespace (printf "%s-postgres" (include "git-synapse.fullname" .)) -}}
{{- $password := .Values.postgresql.password -}}
{{- if and (not $password) $pg }}{{- $password = (index $pg.data "POSTGRES_PASSWORD" | b64dec) -}}{{- end }}
{{- if not $password }}{{- $password = randAlphaNum 32 -}}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "git-synapse.fullname" . }}-postgres
  labels:
    {{- include "git-synapse.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
{{- end }}
