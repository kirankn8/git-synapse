apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "git-synapse.fullname" . }}-scheduler
  labels:
    {{- include "git-synapse.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: scheduler
      {{- include "git-synapse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: scheduler
        {{- include "git-synapse.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: scheduler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "git_synapse.scheduler.main"]
          env:
            {{- include "git-synapse.env" . | nindent 12 }}
            - name: SCHEDULER_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "git-synapse.fullname" . }}-config
                  key: SCHEDULER_ENABLED
            - name: REFRESH_ON_START
              valueFrom:
                configMapKeyRef:
                  name: {{ include "git-synapse.fullname" . }}-config
                  key: REFRESH_ON_START
          volumeMounts:
            - name: mirrors
              mountPath: /data/mirrors
      volumes:
        - name: mirrors
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "git-synapse.fullname" . }}-mirrors
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if .Values.mcp.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "git-synapse.fullname" . }}-mcp
  labels:
    {{- include "git-synapse.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mcp.service.type }}
  selector:
    app.kubernetes.io/component: mcp
    {{- include "git-synapse.selectorLabels" . | nindent 4 }}
  ports:
    - name: mcp
      port: {{ .Values.mcp.port }}
      targetPort: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "git-synapse.fullname" . }}-mcp
  labels:
    {{- include "git-synapse.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp
      {{- include "git-synapse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mcp
        {{- include "git-synapse.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "git_synapse.mcp.server", "--transport", "http", "--host", "0.0.0.0", "--port", "8081"]
          env:
            {{- include "git-synapse.env" . | nindent 12 }}
            - name: MCP_HOST
              value: 0.0.0.0
            - name: MCP_PORT
              value: "8081"
          ports:
            - name: mcp
              containerPort: 8081
          volumeMounts:
            - name: mirrors
              mountPath: /data/mirrors
      volumes:
        - name: mirrors
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "git-synapse.fullname" . }}-mirrors
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
