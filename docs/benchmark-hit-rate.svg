<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">OSS benchmark: four baselines versus Git Synapse</title>
  <desc id="desc">Top-five hit rates for Tourist, Intern, Apprentice, New Hire, and Git Synapse across six open-source projects. Git Synapse wins on Laravel, Prometheus, Tokio, and Vue; Guava and Flask are counterexamples.</desc>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#dbeafe}
    .muted{fill:#94a3b8}.grid{stroke:#334155;stroke-width:1}.tour{fill:#475569}.intern{fill:#64748b}.appr{fill:#818cf8}.hire{fill:#c084fc}.syn{fill:#2dd4bf}.label{font-size:15px}.small{font-size:12px}.title{font-size:24px;font-weight:700}.value{font-size:11px;font-weight:700}
  </style>
  <rect width="1200" height="700" rx="20" fill="#0f172a"/>
  <text x="48" y="44" class="title">What does Git Synapse add beyond free guesses?</text>
  <text x="48" y="68" class="muted small">Top-5 hit rate · obscure seed · minimum pair support 2 · full replay: 34,817 prompts across six OSS projects</text>
  <g class="small"><rect x="700" y="39" width="12" height="12" rx="3" class="tour"/><text x="718" y="49">Tourist</text><rect x="782" y="39" width="12" height="12" rx="3" class="intern"/><text x="800" y="49">Intern</text><rect x="856" y="39" width="12" height="12" rx="3" class="appr"/><text x="874" y="49">Apprentice</text><rect x="972" y="39" width="12" height="12" rx="3" class="hire"/><text x="990" y="49">New Hire*</text><rect x="1080" y="39" width="12" height="12" rx="3" class="syn"/><text x="1098" y="49">Git Synapse</text></g>
  <g class="grid"><path d="M260 100V630M400 100V630M540 100V630M680 100V630M820 100V630M960 100V630M1100 100V630"/></g>
  <g class="muted small"><text x="252" y="655">0%</text><text x="388" y="655">20%</text><text x="528" y="655">40%</text><text x="668" y="655">60%</text><text x="808" y="655">80%</text><text x="948" y="655">100%</text></g>
  <g class="label"><text x="48" y="135">google/guava</text><text x="48" y="225">laravel/framework</text><text x="48" y="315">pallets/flask</text><text x="48" y="405">prometheus/prometheus</text><text x="48" y="495">tokio-rs/tokio</text><text x="48" y="585">vuejs/core</text></g>
