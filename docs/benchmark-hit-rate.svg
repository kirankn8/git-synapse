<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">OSS benchmark: free baseline versus Git Synapse P(B|A)</title>
  <desc id="desc">Top-five hit rates across six open-source projects from a time-ordered benchmark of 34,810 prompts.</desc>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#dbeafe}
    .muted{fill:#94a3b8}.grid{stroke:#334155;stroke-width:1}.base{fill:#64748b}.syn{fill:#2dd4bf}.label{font-size:16px}.small{font-size:13px}.title{font-size:24px;font-weight:700}.value{font-size:13px;font-weight:700}
  </style>
  <rect width="1100" height="520" rx="20" fill="#0f172a"/>
  <text x="48" y="48" class="title">History adds signal when structure does not</text>
  <text x="48" y="73" class="muted small">Top-5 hit rate · obscure seed · minimum pair support 2 · 71,430 commits · 34,810 prompts</text>
  <rect x="790" y="43" width="13" height="13" rx="3" class="base"/><text x="812" y="54" class="small">free baseline</text>
  <rect x="925" y="43" width="13" height="13" rx="3" class="syn"/><text x="947" y="54" class="small">P(B|A)</text>
  <g class="grid">
    <path d="M270 108V458M430 108V458M590 108V458M750 108V458M910 108V458"/>
  </g>
  <g class="muted small"><text x="262" y="485">0%</text><text x="418" y="485">20%</text><text x="578" y="485">40%</text><text x="738" y="485">60%</text><text x="898" y="485">80%</text></g>
  <g class="label">
    <text x="48" y="137">google/guava</text><text x="48" y="195">laravel/framework</text><text x="48" y="253">pallets/flask</text><text x="48" y="311">prometheus/prometheus</text><text x="48" y="369">tokio-rs/tokio</text><text x="48" y="427">vuejs/core</text>
  </g>
  <g>
    <rect x="270" y="119" width="605" height="16" rx="8" class="base"/><rect x="270" y="139" width="442" height="16" rx="8" class="syn"/>
    <rect x="270" y="177" width="242" height="16" rx="8" class="base"/><rect x="270" y="197" width="440" height="16" rx="8" class="syn"/>
    <rect x="270" y="235" width="453" height="16" rx="8" class="base"/><rect x="270" y="255" width="448" height="16" rx="8" class="syn"/>
    <rect x="270" y="293" width="414" height="16" rx="8" class="base"/><rect x="270" y="313" width="518" height="16" rx="8" class="syn"/>
    <rect x="270" y="351" width="304" height="16" rx="8" class="base"/><rect x="270" y="371" width="360" height="16" rx="8" class="syn"/>
    <rect x="270" y="409" width="460" height="16" rx="8" class="base"/><rect x="270" y="429" width="491" height="16" rx="8" class="syn"/>
  </g>
