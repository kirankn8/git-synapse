<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Weighted OSS benchmark by measure</title>
  <desc id="desc">Weighted top-five hit rates: free baseline 48.0 percent, P(B|A) 57.5, G squared 54.2, Jaccard 50.0, NPMI 47.1, and P(A|B) 34.4.</desc>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#dbeafe}.muted{fill:#94a3b8}.grid{stroke:#334155;stroke-width:1}.bar{fill:#2dd4bf}.base{fill:#64748b}.label{font-size:15px}.small{font-size:13px}.title{font-size:24px;font-weight:700}.value{font-size:14px;font-weight:700}
  </style>
  <rect width="1100" height="430" rx="20" fill="#0f172a"/>
  <text x="48" y="48" class="title">Different measures answer different questions</text>
  <text x="48" y="73" class="muted small">Weighted top-5 hit rate across the same 34,810 prompts</text>
  <g class="grid"><path d="M300 108V365M460 108V365M620 108V365M780 108V365M940 108V365"/></g>
  <g class="muted small"><text x="292" y="392">0%</text><text x="448" y="392">20%</text><text x="608" y="392">40%</text><text x="768" y="392">60%</text><text x="928" y="392">80%</text></g>
  <g class="label"><text x="48" y="135">Free baseline</text><text x="48" y="175">P(B|A)</text><text x="48" y="215">G²</text><text x="48" y="255">Jaccard</text><text x="48" y="295">NPMI</text><text x="48" y="335">P(A|B)</text></g>
  <g><rect x="300" y="120" width="384" height="18" rx="9" class="base"/><rect x="300" y="160" width="460" height="18" rx="9" class="bar"/><rect x="300" y="200" width="434" height="18" rx="9" class="bar"/><rect x="300" y="240" width="400" height="18" rx="9" class="bar"/><rect x="300" y="280" width="377" height="18" rx="9" class="bar"/><rect x="300" y="320" width="275" height="18" rx="9" class="bar"/></g>
  <g class="value"><text x="694" y="135">48.0%</text><text x="770" y="175">57.5%</text><text x="744" y="215">54.2%</text><text x="710" y="255">50.0%</text><text x="687" y="295">47.1%</text><text x="585" y="335">34.4%</text></g>
</svg>
