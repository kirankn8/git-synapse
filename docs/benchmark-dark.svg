<svg xmlns="http://www.w3.org/2000/svg" width="820" height="204" viewBox="0 0 820 204" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<text x="0" y="20" font-size="15" font-weight="700" fill="#e6edf3">What history adds to what an agent already finds for free</text>
<text x="0" y="40" font-size="12" fill="#9198a1">Every prediction scored only against commits that came before it</text>
<rect x="0" y="54" width="10" height="10" rx="2" fill="#30363d"/><text x="16" y="63" font-size="11.5" fill="#9198a1">the file&#8217;s test, its siblings and its directory</text>
<rect x="290" y="54" width="10" height="10" rx="2" fill="#2dd4bf"/><text x="306" y="63" font-size="11.5" fill="#9198a1">recovered by Git Synapse from history</text>
<line x1="0" y1="65" x2="820" y2="65" stroke="#30363d" stroke-width="1"/>
<text x="0" y="87" font-size="13" font-weight="600" fill="#e6edf3">google (38 repos)</text>
<text x="0" y="102" font-size="10.5" fill="#6e7681">240,734 predictions</text>
<rect x="132" y="74" width="336.8" height="20" rx="3" fill="#30363d"/>
<rect x="468.8" y="74" width="110.5" height="20" fill="#2dd4bf"/>
<text x="140" y="88" font-size="11" fill="#9198a1">56.9%</text>
<text x="474.8" y="88" font-size="11" font-weight="700" fill="#ffffff">+18.7</text>
<text x="814" y="90" font-size="17" font-weight="700" text-anchor="end" fill="#2dd4bf">75.6%</text>
<line x1="0" y1="115" x2="820" y2="115" stroke="#30363d" stroke-width="1"/>
<text x="0" y="137" font-size="13" font-weight="600" fill="#e6edf3">guava</text>
<text x="0" y="152" font-size="10.5" fill="#6e7681">24,995 predictions</text>
<rect x="132" y="124" width="453.5" height="20" rx="3" fill="#30363d"/>
<rect x="585.5" y="124" width="47.8" height="20" fill="#2dd4bf"/>
<text x="140" y="138" font-size="11" fill="#9198a1">76.6%</text>
<text x="591.5" y="138" font-size="11" font-weight="700" fill="#ffffff">+8.1</text>
<text x="814" y="140" font-size="17" font-weight="700" text-anchor="end" fill="#2dd4bf">84.7%</text>
<text x="0" y="196" font-size="10.5" fill="#6e7681">Share of predictions where at least one file that really changed appeared in the top 5. The two are complementary, not rivals: on its own, history loses to the free rules.</text>
</svg>