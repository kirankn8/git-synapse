<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400"
     role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title id="t">One change, and everything that usually follows it</title>
  <desc id="d">You change one file. History shows three more files in the same
  repository that almost always change with it, and two other services that
  follow within days. Your editor showed you one of the six.</desc>

  <style>
    :root { color-scheme: light dark; }
    svg { --ink:#102039; --dim:#52647c; --faint:#7d8ca2; --line:#c3cedd;
          --card:#ffffff; --card2:#f4f7fb; --edge:#dbe3ee;
          --you:#0d9488; --youInk:#ffffff; --hit:#b45309; --hitBg:#fff7e6; --hitEdge:#e6c88a; }
    @media (prefers-color-scheme: dark) {
      svg { --ink:#e6edf7; --dim:#9aaac0; --faint:#6b7e9c; --line:#2c3d59;
            --card:#101a2c; --card2:#0d1524; --edge:#22334f;
            --you:#2dd4bf; --youInk:#04121a; --hit:#fbbf24; --hitBg:#1d1a0e; --hitEdge:#6b5320; }
    }
    .ttl  { fill: var(--ink);  font-size: 17px; font-weight: 700; }
    .sub  { fill: var(--dim);  font-size: 13px; }
    .lab  { fill: var(--faint); font-size: 11px; font-weight: 700; letter-spacing: .09em; }
    .name { fill: var(--ink);  font-size: 13px; font-weight: 600; }
    .note { fill: var(--dim);  font-size: 11.5px; }
    .cnt  { fill: var(--hit);  font-size: 11.5px; font-weight: 700; }
    .card { fill: var(--card); stroke: var(--edge); }
    .hitcard { fill: var(--hitBg); stroke: var(--hitEdge); }
    .link { stroke: var(--line); fill: none; stroke-width: 1.5; stroke-dasharray: 5 5; }

    /* One 9s story, looping: the change lands, then what it reaches lights up. */
    .ripple { fill: none; stroke: var(--you); stroke-width: 2; opacity: 0;
              transform-origin: 118px 200px; animation: ripple 9s ease-out infinite; }
    .r2 { animation-delay: .45s; } .r3 { animation-delay: .9s; }
    @keyframes ripple {
      0%   { transform: scale(.35); opacity: .75; }
      26%  { transform: scale(2.6);  opacity: 0; }
      100% { transform: scale(2.6);  opacity: 0; }
    }
    .you { transform-origin: 118px 200px; animation: beat 9s ease-in-out infinite; }
    @keyframes beat {
      0%, 10% { transform: scale(1); }
      4%      { transform: scale(1.055); }
      100%    { transform: scale(1); }
    }
    .step { opacity: 0; animation: step 9s ease-out infinite; }
    @keyframes step {
      0%, 8%    { opacity: 0; transform: translateX(-10px); }
      16%, 88%  { opacity: 1; transform: translateX(0); }
      97%, 100% { opacity: 0; transform: translateX(0); }
    }
    .s1 { animation-delay: .5s; } .s2 { animation-delay: 1.1s; } .s3 { animation-delay: 1.7s; }
    .s4 { animation-delay: 2.6s; } .s5 { animation-delay: 3.2s; }
    .punch { opacity: 0; animation: punch 9s ease-out infinite; animation-delay: 4.1s; }
    @keyframes punch { 0%,3% { opacity: 0; } 10%,84% { opacity: 1; } 95%,100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .ripple { display: none; }
      .you, .step, .punch { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <text class="ttl" x="24" y="30">You change one file.</text>
  <text class="sub" x="24" y="52">Five other things usually change with it. Your editor can see one of them.</text>

  <!-- the change that starts it -->
  <g class="ripple r1"><circle cx="118" cy="200" r="46"/></g>
  <g class="ripple r2"><circle cx="118" cy="200" r="46"/></g>
  <g class="ripple r3"><circle cx="118" cy="200" r="46"/></g>
  <g class="you">
    <rect x="34" y="176" width="168" height="48" rx="10" fill="var(--you)"/>
    <text x="118" y="197" text-anchor="middle" font-size="13.5" font-weight="700" fill="var(--youInk)">models.py</text>
    <text x="118" y="213" text-anchor="middle" font-size="11" fill="var(--youInk)" opacity=".82">the file you changed</text>
  </g>
  <text class="lab" x="34" y="252">WHAT YOUR EDITOR SHOWS</text>
  <text class="note" x="34" y="270">this file, and what it imports</text>

  <path class="link" d="M210 200 H 268"/>

  <!-- same repository -->
  <text class="lab" x="292" y="86">SAME REPOSITORY</text>
  <g class="step s1">
    <rect class="hitcard" x="292" y="98" width="252" height="46" rx="9"/>
    <text class="name" x="308" y="119">its test file</text>
    <text class="cnt"  x="308" y="135">changed together 142 times</text>
  </g>
  <g class="step s2">
    <rect class="hitcard" x="292" y="152" width="252" height="46" rx="9"/>
    <text class="name" x="308" y="173">the serializer</text>
    <text class="cnt"  x="308" y="189">changed together 31 times</text>
  </g>
  <g class="step s3">
    <rect class="hitcard" x="292" y="206" width="252" height="46" rx="9"/>
    <text class="name" x="308" y="227">the database migration</text>
    <text class="cnt"  x="308" y="243">changed together 18 times</text>
  </g>

  <path class="link" d="M552 200 H 596"/>

  <!-- other repositories -->
  <text class="lab" x="600" y="86">OTHER REPOSITORIES</text>
  <text class="note" x="600" y="104">not open in your editor at all</text>
  <g class="step s4">
    <rect class="hitcard" x="600" y="116" width="256" height="46" rx="9"/>
    <text class="name" x="616" y="137">the billing service</text>
    <text class="cnt"  x="616" y="153">follows within 3 days, 24 times</text>
  </g>
  <g class="step s5">
    <rect class="hitcard" x="600" y="170" width="256" height="46" rx="9"/>
    <text class="name" x="616" y="191">the web app</text>
    <text class="cnt"  x="616" y="207">follows within 5 days, 17 times</text>
  </g>

  <!-- the point -->
  <g class="punch">
    <rect class="card" x="292" y="300" width="564" height="62" rx="10"/>
    <text class="name" x="312" y="325" font-size="14">Six places needed the change. One was on your screen.</text>
    <text class="note" x="312" y="345">Git Synapse reads the other five out of commits you already have.</text>
  </g>
</svg>
