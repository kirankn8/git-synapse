<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Git Synapse: a commit branch whose connection is a synaptic cleft.
       The gap is the point — two things that must fire together, with a
       signal crossing between them. -->
  <rect width="32" height="32" rx="7" fill="#0d1524"/>
  <g stroke="#5eead4" stroke-width="2.1" stroke-linecap="round" fill="none">
    <path d="M8 24 C 8 18.5, 9.5 15.5, 12 13.6"/>
    <path d="M20 18.4 C 22.5 16.5, 24 13.5, 24 8"/>
  </g>
  <circle cx="14.6" cy="15.1" r="1.15" fill="#5eead4" opacity=".55"/>
  <circle cx="17.4" cy="16.9" r="1.15" fill="#5eead4" opacity=".8"/>
  <circle cx="8" cy="24" r="3.4" fill="#5eead4"/>
  <circle cx="24" cy="8" r="3.4" fill="#5eead4"/>
  <circle cx="8" cy="24" r="1.3" fill="#0d1524"/>
  <circle cx="24" cy="8" r="1.3" fill="#0d1524"/>
</svg>
