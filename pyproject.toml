[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-synapse"
version = "1.0.0"
description = "Change-coupling statistics over git history, so coding agents know what else must change."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "psycopg[binary,pool]>=3.1",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "apscheduler>=3.10,<4",
    "typer>=0.12",
    "rich>=13.7",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-timeout>=2.3", "ruff>=0.5"]

[project.scripts]
git-synapse = "git_synapse.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
git_synapse = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# A hung test is far worse than a failing one: no output, no traceback, and a
# CI job that sits until something else kills it. One test called main() with
# the http transport, reached a real uvicorn, and stopped the suite at 46% with
# nothing on screen to say why. Sixty seconds is longer than the slowest real
# test here by an order of magnitude.
timeout = 60
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.report]
# Reaching 100% cost real bugs found -- a tag naming a blob indexed as a
# release, a sweep deleting every commit the tag walk had just read, stubs that
# had rotted because their tests never ran. The gate is here so it stays there.
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
]
